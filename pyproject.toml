[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dandeliion-client"
version = "2.0.0"
description = "Client for accessing Dandeliion services"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["dandeliion", "client"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "bpx~=0.5.0",
  "ijson>=3.5,<4",
  "numpy>=2,<3",
  "requests~=2.34.2",
]
requires-python = ">=3.10,<3.14"
authors = [
  {name = "DandeLiion Technologies Limited", email = "team@dandeliion.com"},
]
maintainers = [
  {name = "DandeLiion Technologies Limited", email = "team@dandeliion.com"},
]

[project.urls]
Homepage = "https://dandeliion.com"
Documentation = "https://dandeliion-team.github.io/dandeliion-client/"
Repository = "https://github.com/dandeliion-team/dandeliion-client"
"Bug Tracker" = "https://github.com/dandeliion-team/dandeliion-client/issues"
Changelog = "https://github.com/dandeliion-team/dandeliion-client/blob/develop/CHANGELOG.md"

[project.optional-dependencies]
docs = [
    "sphinx>=6",
    "sphinx_rtd_theme>=0.5",
    "pydata-sphinx-theme",
    "sphinx_design",
    "sphinx-copybutton",
    "myst-parser",
    "sphinx-inline-tabs",
    "sphinxcontrib-bibtex",
    "sphinx-autobuild",
    "sphinx-last-updated-by-git",
    "nbsphinx",
    "ipykernel",
    "ipywidgets",
    "sphinx-gallery",
    "sphinx-hoverxref",
    "sphinx-docsearch",
    "pybamm~=26.7.1",
]
dev = [
    "nox",
    "pytest",
    "pytest-sugar",
    "pytest-timeout",
    "pytest-cov",
    "build",
    "pip-audit",
    "ruff",
    "mypy",
    "pre-commit",
    "types-requests",
    "twine",
]
pybamm = [
    "pybamm~=26.7.1",
]

# [tool.pytest]
# addopts = -p no:warnings

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = [
  "src/python"
]

[tool.coverage.run]
branch = true
source = ["dandeliion.client"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
extend-exclude = ["examples/*.ipynb"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
packages = ["dandeliion.client"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "bpx",
  "ijson",
  "pybamm",
  "pybamm.*",
]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["dandeliion"]

[tool.hatch.build.targets.wheel]
sources = ["src/python"]
only-include = ["src/python/dandeliion/client"]
